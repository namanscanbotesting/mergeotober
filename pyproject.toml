[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devmemory"
version = "0.1.0"
description = "DevMemory: Institutional Engineering Memory on Cognee for Mergetober"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee>=0.1.20",
    "dlt>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/connector", "tests"]
python_files = ["test_*.py"]
