[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-community-connector-vercel"
version = "0.1.0"
description = "Cognee declarative DLT connector for Vercel release deployments and commit SHAs with secret scrubbing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee>=0.1.20",
    "dlt>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
