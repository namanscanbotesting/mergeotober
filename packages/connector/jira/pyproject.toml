[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-community-connector-jira"
version = "0.1.0"
description = "Cognee DLT connector for Atlassian Jira issues, comments, and changelogs with JQL incremental cursors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee>=0.1.20",
    "dlt>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
